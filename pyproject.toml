[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codex-coordinator"
version = "0.1.0"
description = "Coordinate Codex worker sessions with independently judged approvals"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["websockets>=15,<16"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/joshpearce/codex_coordinator"
Source = "https://github.com/joshpearce/codex_coordinator"
Issues = "https://github.com/joshpearce/codex_coordinator/issues"

[project.optional-dependencies]
test = ["build>=1", "pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
codex-coordinator-service = "codex_coordinator.service:main"
codex-coordinator-preflight = "codex_coordinator.preflight:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
