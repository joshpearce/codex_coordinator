# The live harness resolves the app-server socket path before starting Codex.
approval_policy = "never"
default_permissions = "coordinator"
model = "gpt-5.6-sol"
model_reasoning_effort = "medium"

[permissions.coordinator]
extends = ":workspace"

[permissions.coordinator.network]
enabled = true
mode = "full"

[permissions.coordinator.network.unix_sockets]
"{{APP_SERVER_SOCKET}}" = "allow"
