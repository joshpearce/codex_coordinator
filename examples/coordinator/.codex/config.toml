# Safe baseline for opening this template directly. The live harness explicitly uses
# --dangerously-bypass-approvals-and-sandbox because the POC must reach the daemon
# socket and localhost, start nested Codex processes, and inspect sibling projects.
approval_policy = "never"
sandbox_mode = "workspace-write"
model = "gpt-5.6-sol"
model_reasoning_effort = "medium"
