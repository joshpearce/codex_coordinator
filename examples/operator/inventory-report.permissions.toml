# Execution boundary for the inventory-report worker.
#
# Operator-owned and outside every worker- and coordinator-writable root. The
# coordinator parses this file and sends these values on the wire when it
# starts the project's Codex session; the project directory itself carries no
# Codex configuration, so nothing the worker can write decides what its next
# session may do.
#
# Execution is confined to a sandbox in which only this project directory is
# writable and the network is unavailable, so anything beyond that boundary has
# to be approved by a reviewer before it runs. Under "untrusted" the runtime
# raises an approval request before anything it does not already trust, so what
# reaches a reviewer follows this file rather than the worker's own discretion.
# Any key may be omitted to take the operator-wide default from operator.toml.
approval_policy = "untrusted"
approvals_reviewer = "user"
sandbox_mode = "workspace-write"
# Mundane project-local commands the coordinator decides itself, by rule,
# before a request would reach a judge: range reads, searches, and this
# project's own test and CLI entry points. The file sits beside this one under
# the same ownership rules and is never handed to the Codex runtime. Every
# command it does not name still reaches a judge.
#
# The same file is where an operator would name in-project paths whose file
# changes should reach a judge anyway. This project names none: inside its own
# project a worker edits by right, under a sandbox that makes that project the
# only writable root with no network.
exec_policy = "inventory-report.rules"
