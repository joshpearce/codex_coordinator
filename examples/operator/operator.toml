# The live harness resolves these paths into its private example workspace.
# Keep this file and every constitution outside the coordinator and both worker
# project directories.
allowed_roots = ["{{INVENTORY_APP_PATH}}", "{{INVENTORY_REPORT_PATH}}"]
# Where every permission profile named below is defined. The harness renders
# examples/operator/codex-home/config.toml into a temporary home per run, so a
# passing run is evidence about the configuration under test rather than about
# whatever ~/.codex happens to hold on one machine.
codex_home = "{{CODEX_HOME_PATH}}"
# This run's own app-server, started by the harness on the rendered home. The
# shared daemon is not used: `codex app-server daemon start` requires the
# managed standalone install under the home it is given, and lending it the
# developer's would put the run back on their install.
socket_path = "{{APP_SERVER_SOCKET}}"
approval_mode = "service"
constitution_path = "{{OPERATOR_PATH}}/constitution.md"
coordinator_root = "{{COORDINATOR_PATH}}"
# The approval policy for any project that does not declare its own below.
# Under "untrusted" the runtime raises an approval request before anything it
# does not already trust, so what a judge sees follows operator configuration
# rather than a worker's discretion or its prompt.
worker_approval_policy = "untrusted"
worker_model = "gpt-5.6-luna"
worker_reasoning_effort = "low"
worker_allowed_reasoning_efforts = ["low"]

# Each worker's execution boundary, kept here rather than in the project it
# governs: a file inside a worker's writable root is a file that worker can
# rewrite. Each file names a permission profile id; the coordinator sends the id
# on thread/start and refuses the session unless the runtime reports back that
# it selected that same profile.
[worker_permissions]
"{{INVENTORY_APP_PATH}}" = "{{OPERATOR_PATH}}/inventory-app.permissions.toml"
"{{INVENTORY_REPORT_PATH}}" = "{{OPERATOR_PATH}}/inventory-report.permissions.toml"

# Second tier: the policy a judge sees for one project and for no other.
# Service judging requires one of these for every allowed root.
[project_constitutions]
"{{INVENTORY_APP_PATH}}" = "{{OPERATOR_PATH}}/inventory-app.constitution.md"
"{{INVENTORY_REPORT_PATH}}" = "{{OPERATOR_PATH}}/inventory-report.constitution.md"
