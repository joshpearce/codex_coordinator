name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-install:
    # Ubuntu-hosted runners cannot create the network namespace required by
    # Codex's bwrap sandbox, so run real-boundary tests on a supported host.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Codex CLI
        run: npm install -g @openai/codex@0.154.0
      - name: Install test dependencies
        run: python -m pip install -e '.[test]'
      - name: Run full test suite
        run: python -m pytest -q
      - name: Verify isolated build and installed wheel
        run: sh scripts/release_gate.sh --installed-only
